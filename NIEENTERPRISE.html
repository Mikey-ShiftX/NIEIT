<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NIE Enterprise Student Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* ===== ENTERPRISE BASE ===== */
body{
margin:0;
font-family:Segoe UI,Arial;
background:#f2f4f7;
color:#333;
}

.hidden{display:none}

.container-main{
max-width:1100px;
margin:auto;
}

/* ===== LOGIN ===== */
.login-wrap{
display:flex;
min-height:100vh;
}

.left{
flex:2;
background:#8ea8bb;
padding:60px;
color:#000;
}

.right{
flex:1;
background:#2b2e6e;
display:flex;
align-items:center;
justify-content:center;
}

.login-card{
background:#fff;
padding:30px;
width:320px;
border-radius:6px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

input,select{
width:100%;
padding:12px;
margin-bottom:12px;
font-size:16px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

.dob{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:10px;
}

button{
padding:10px;
width:100%;
background:#2b2e6e;
color:#fff;
border:none;
border-radius:6px;
font-size:15px;
cursor:pointer;
}

/* ===== HEADER ===== */
.topbar{
background:#2b2e6e;
color:#fff;
padding:12px 20px;
display:flex;
justify-content:space-between;
}

.profile{
background:#dcdcdc;
display:flex;
}

.profile-left{
background:#c42026;
color:#fff;
padding:18px;
width:260px;
font-weight:bold;
}

.profile-right{
flex:1;
padding:18px;
text-align:right;
font-size:14px;
}

/* ===== SUBJECT TABS ===== */
.tab{
background:#f5f5f5;
border:1px solid #ddd;
color:#222;
font-size:13px;
padding:10px;
border-radius:4px;
text-align:left;
line-height:1.3;
width:100%;
}

.tabs{
background:#fff;
border-bottom:1px solid #ddd;
padding:10px;
display:flex;
flex-direction:column;
gap:6px;
}

.tab.active{
background:#fff;
color:#c42026;
border:1px solid #c42026;
font-weight:600;
}

/* ===== CARDS ===== */
.content{
padding:15px;
}

.row{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.card{
background:#fff;
border:1px solid #ddd;
padding:15px;
flex:1;
min-width:300px;
box-shadow:0 1px 4px rgba(0,0,0,0.08);
}

/* ===== BADGES ===== */
.badge-green{
background:#1b8a3d;
color:#fff;
padding:4px 10px;
font-size:12px;
margin-right:10px;
}

.badge-red{
background:#e60000;
color:#fff;
padding:4px 10px;
font-size:12px;
}

/* ===== INFO STRIP ===== */
.info{
background:#f6f6f6;
padding:10px;
margin-top:10px;
display:flex;
gap:20px;
flex-wrap:wrap;
font-size:13px;
}

/* ===== MOBILE ===== */
@media(max-width:768px){
.login-wrap{flex-direction:column}
.left{padding:30px;text-align:center}
.profile{flex-direction:column}
.profile-left{width:100%}
.profile-right{text-align:left}
.row{flex-direction:column}
}
/* ===== FIX GRAPH SIZE (Enterprise Stable) ===== */
canvas{
    width:100% !important;
    max-height:260px;
}

/* Optional: better mobile look */
@media(max-width:768px){
    canvas{
        max-height:220px;
    }
}

.legend{
margin-top:10px;
display:flex;
flex-wrap:wrap;
gap:10px;
font-size:12px;
}

.legend-item{
display:flex;
align-items:center;
gap:6px;
background:#f6f6f6;
padding:4px 8px;
border-radius:4px;
border:1px solid #ddd;
}

.legend-color{
width:12px;
height:12px;
border-radius:2px;
}

</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="login-wrap">
<div class="left">
<h2>The National Institute of Engineering</h2>
<p>Enterprise Student Portal</p>
</div>

<div class="right">
<div class="login-card">
<h3>Login</h3>
<input id="username" placeholder="USN">

<div class="dob">
<select id="day">
<option disabled selected>Day</option>
<script>
for(let i=1;i<=31;i++){
let v=i<10?"0"+i:i;
document.write(`<option>${v}</option>`);
}
</script>
</select>

<select id="month">
<option disabled selected>Month</option>
<option>Jan</option><option>Feb</option><option>Mar</option>
<option>Apr</option><option>May</option><option>Jun</option>
<option>Jul</option><option>Aug</option><option>Sep</option>
<option>Oct</option><option>Nov</option><option>Dec</option>
</select>

<select id="year">
<option disabled selected>Year</option>
<script>
for(let y=2026;y>=1946;y--){
document.write(`<option>${y}</option>`);
}
</script>
</select>
</div>

<button onclick="login()">LOGIN</button>
<p id="error" style="color:red"></p>
</div>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden container-main">

<div class="topbar">
NIE Enterprise Portal
<div onclick="location.reload()" style="cursor:pointer">Logout</div>
</div>

<div class="profile">
<div class="profile-left" id="studentName"></div>
<div class="profile-right">
<span id="studentUSN"></span><br>
B.E – CSE<br>
Last Updated: 07/02/2026
</div>
</div>

<div class="tabs" id="tabs"></div>

<div class="content">

<!-- DASHBOARD -->
<div id="dashboard">
<div class="row">
<div class="card">
<h4>CIE Overview</h4>
<canvas id="overviewChart" height="200"></canvas>
</div>

<div class="card">
<h4>Attendance</h4>
<canvas id="attChart" height="200"></canvas>
<div id="attLegend" class="legend"></div>
</div>
</div>
</div>

<!-- SUBJECT -->
<div id="subjectPage" class="hidden">

<div class="row">
<div class="card" style="flex:2;display:flex;gap:15px;align-items:center">
<img id="facultyImg" width="70" height="70" style="border-radius:50%">
<div>
<div id="faculty" style="font-weight:600"></div>
<div id="subjectTitle" style="font-size:13px;color:#666"></div>
</div>
</div>

<div class="card">
<div style="margin-bottom:6px;font-weight:600">Internal Assessment</div>
<span class="badge-green" id="cieBadge"></span>
<span class="badge-red" id="attBadge"></span>
</div>
</div>

<div class="info" id="infoRow"></div>

<div class="card">
<canvas id="subjectChart" height="220"></canvas>
</div>

</div>

</div>
</div>

let current;
let subjectChart;
let overviewChartInstance;
let attChartInstance;

/* LOGIN */
function login(){
let u=username.value.trim();
let d=day.value;
let m=month.value;
let y=year.value;

if(students[u] &&
students[u].dob[0]==d &&
students[u].dob[1]==m &&
students[u].dob[2]==y){

current=students[u];
loginPage.style.display="none";
app.classList.remove("hidden");

studentName.innerText=current.name;
studentUSN.innerText=u;

createTabs();
loadDashboard();
showDashboard();

}else{
error.innerText="Invalid credentials";
}
}

/* TABS */
function createTabs(){

let html = `<button class="tab active" onclick="showDashboard()">HOME</button>`;

for(let code in current.subjects){

let title = subjectNames[code] || "";

html += `
<button class="tab" onclick="openSubject('${code}',this)">
<b>${code}</b><br>
<span style="font-size:11px;color:#666">${title}</span>
</button>
`;
}

tabs.innerHTML = html;
}

/* DASHBOARD */
function loadDashboard(){

let labels = Object.keys(current.subjects);
let cie = labels.map(l=>current.subjects[l].cie);
let att = labels.map(l=>current.subjects[l].att);

/* destroy old charts if exist */
if(overviewChartInstance) overviewChartInstance.destroy();
if(attChartInstance) attChartInstance.destroy();

/* ===== CIE BAR ===== */
overviewChartInstance = new Chart(overviewChart,{
type:"bar",
data:{
labels,
datasets:[{
label:"CIE Marks",
data:cie,
backgroundColor:[
"#7aa6b8","#b7a6b8","#6f9f88","#d9a066",
"#7f88a6","#c77c8a","#8da5a9","#9fbf7f",
"#c9a77a","#7aa6b8"
]
}]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{
display:true,
position:"bottom"
}
},
scales:{y:{beginAtZero:true,max:70}}
}
});

/* ===== ATTENDANCE RINGS ===== */

const attColors = [
"#6c9e7a",
"#7aa6b8",
"#b7a6b8",
"#d9a066",
"#7f88a6",
"#c77c8a",
"#8da5a9",
"#9fbf7f",
"#c9a77a",
"#7f9da3"
];

let datasets=[];

att.forEach((v,i)=>{
datasets.push({
label: labels[i],   // subject code
data:[v,100-v],
backgroundColor:[attColors[i], "#e6e6e6"],
rotation:270,
circumference:180,
cutout:`${80 - i*4}%`,
borderWidth:0
});
});

attChartInstance = new Chart(attChart,{
type:"doughnut",
data:{datasets},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{
display:true,
position:"bottom",
labels:{
boxWidth:12,
font:{size:11}
}
}
}
}
});

/* ===== Attendance Legend ===== */
let legendHTML = "";

labels.forEach((code,i)=>{
legendHTML += `
<div class="legend-item">
<div class="legend-color" style="background:${attColors[i]}"></div>
${code}
</div>
`;
});

document.getElementById("attLegend").innerHTML = legendHTML;

}

/* SUBJECT */
function openSubject(code,btn){

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
btn.classList.add("active");

dashboard.classList.add("hidden");
subjectPage.classList.remove("hidden");

let s=current.subjects[code];

faculty.innerText="Faculty Name";
subjectTitle.innerText=code;
facultyImg.src="https://i.imgur.com/Z6X4C0N.jpg";

cieBadge.innerText="FINAL CIE: "+s.cie;
attBadge.innerText="ATTENDANCE: "+s.att+"%";

let maxCIE=code.includes("L")||code.includes("PRJ")?50:100;

infoRow.innerHTML=`
<span>Current CIE: ${s.cie}/${maxCIE}</span>
<span>Attendance: ${s.att}%</span>
`;

if(subjectChart) subjectChart.destroy();

let labels = ["tst1","tst2","qz1","qz2","EL1"];
let obtained = s.marks;
let maxMarks = [25,25,10,10,30];

// Static class average (can make dynamic later)
let classAvg = [12,18,7,9,22];

subjectChart = new Chart(document.getElementById("subjectChart"),{
type:"bar",
data:{
labels:labels,
datasets:[
{
label:"Marks Obtained",
data:obtained,
backgroundColor:"#7fb6cc",
order:2
},
{
label:"Max Marks",
data:maxMarks,
backgroundColor:"#e6e6e6",
order:1
},
{
type:"line",
label:"Class Average",
data:classAvg,
borderColor:"#ff3b00",
backgroundColor:"#ff3b00",
borderWidth:2,
pointRadius:4,
pointBackgroundColor:"#ff3b00",
tension:0,
order:0
}
]
},
options:{
responsive:true,
maintainAspectRatio:false,
plugins:{
legend:{
position:"bottom",
labels:{boxWidth:14}
},
title:{
display:true,
text: subjectNames[code] + " ("+code+")",
font:{size:14}
},
tooltip:{enabled:true}
},
scales:{
y:{
beginAtZero:true,
max:30,
ticks:{stepSize:5}
}
}
}
});
}

function showDashboard(){
subjectPage.classList.add("hidden");
dashboard.classList.remove("hidden");
}
</script>
